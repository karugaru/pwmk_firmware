name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ubuntu-24.04-${{ runner.arch }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-uv-

      - name: Sync Python environment
        run: uv sync --frozen

      - name: Run profile tests
        run: uv run tools/test_profile.py

      - name: Run keyboard tests
        run: uv run tools/test_keyboard.py

  firmware-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile:
          - remopicon_v1
          - remopicon_v2_beta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ubuntu-24.04-${{ runner.arch }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-uv-

      - name: Restore PWMK toolchain cache
        uses: actions/cache@v6
        with:
          path: ~/.pwmk
          key: ubuntu-24.04-${{ runner.arch }}-pwmk-toolchain-${{ hashFiles('tools/pwmk_build_prep.py') }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-pwmk-toolchain-

      - name: Sync Python environment
        run: uv sync --frozen

      - name: Build firmware (${{ matrix.profile }})
        run: uv run tools/pwmk.py build --profile ${{ matrix.profile }} --clean

      - name: Upload firmware artifacts (${{ matrix.profile }})
        uses: actions/upload-artifact@v7
        with:
          name: pwmk-${{ matrix.profile }}-ubuntu-24.04
          path: |
            build/cli/*.uf2
            build/cli/*.elf
            build/cli/*.bin
            build/cli/*.hex
          if-no-files-found: error
